name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Lint Shell Script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          ignore: 'node_modules'

  test:
    name: Run Bats Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Bats
        uses: bats-core/bats-action@2.0.0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc curl jq aria2

      - name: Run Tests
        run: |
          make test
